[project]
name = "ankifier"
version = "0.1.0"
description = ""
authors = [
    {name = "Enes Aydogan",email = "enes35ihsan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "mistralai (>=1.0.0,<2.0.0)",
    "elevenlabs (>=1.0.0,<2.0.0)",
    "requests (>=2.31.0,<3.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.30.0,<1.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
]

[tool.poetry]
packages = [
    {include = "ankifier", from = "src"},
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
ruff = "^0.16.8"

[tool.ruff]
# Matches the front-end's Prettier width, so wrapped code reads the same on
# both sides of the repo.
line-length = 88
src = ["src", "tests"]
# A tab counts as four columns when measuring against `line-length`, matching
# how the editors are configured in .editorconfig.
indent-width = 4

[tool.ruff.format]
# Tabs, as everywhere else in the repo. Ruff still indents continuation lines
# and aligns wrapped arguments itself, so only the leading indent changes.
indent-style = "tab"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: mutable defaults, unused loop vars, ...
    "UP",  # pyupgrade: syntax the pinned Python already supports
    "SIM", # flake8-simplify
]
ignore = [
    # `ruff format` already wraps everything it safely can. What is left over
    # is long string literals -- here, the Mistral prompts, whose whitespace is
    # part of the text sent to the model and must not be rewrapped.
    "E501",
    # Fires on the space-aligned `Args:` blocks inside docstrings, which sit in
    # tab-indented functions. Docstring bodies are prose -- `ruff format` leaves
    # their alignment alone by design, so the mix is expected, not a defect.
    "E101",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency-injection design is a call in an argument default,
# so B008 would fire on every route. These are the calls it may ignore.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[project.scripts]
ankifier = "ankifier.api:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
