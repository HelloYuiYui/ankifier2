name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Front-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from the root package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # ESLint 10 and Vite 8 both need 20.19+/22.13+; 24 satisfies each.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm --filter web format:check

      - name: ESLint
        run: pnpm --filter web lint

      - name: Types
        run: pnpm --filter web typecheck

      # The build is the only check that exercises the Vite config itself.
      - name: Build
        run: pnpm --filter web build

  python:
    name: Back-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pipx install poetry

      - run: poetry install --with dev

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format
        run: poetry run ruff format --check .

      - name: Tests
        run: poetry run pytest -q
